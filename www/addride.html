<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Ride</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
        }
        input, textarea {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Add a Ride</h1>
    <form id="addRideForm">
        <div>
            <label for="name">Driver Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">Email (optional):</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="phone">Phone (optional):</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div>
            <label for="startDateTime">Departure Date &amp; Time:</label>
            <input type="datetime-local" id="startDateTime" name="startDateTime" required>
        </div>
        <div>
            <label for="startTown">Origin Town:</label>
            <input type="text" id="startTown" name="startTown" required>
        </div>
        <div>
            <label for="destinationTown">Destination Town:</label>
            <input type="text" id="destinationTown" name="destinationTown" required>
        </div>
        <div>
            <label for="availableSeats">Available Seats:</label>
            <input type="number" id="availableSeats" name="availableSeats" min="0" required>
        </div>
        <button type="submit">Add Ride</button>
    </form>
    <p id="statusMsg"></p>
    <script>
        document.getElementById('addRideForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const body = {
                contact: {
                    name: form.name.value,
                    email: form.email.value || null,
                    phone: form.phone.value || null
                },
                startDateTime: new Date(form.startDateTime.value).toISOString(),
                startTown: form.startTown.value,
                destinationTown: form.destinationTown.value,
                availableSeats: parseInt(form.availableSeats.value, 10)
            };
            const statusMsg = document.getElementById('statusMsg');
            try {
                const res = await fetch('http://localhost:8081/v1/rides', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    statusMsg.textContent = 'Ride added successfully! ID: ' + data.ride.id;
                    form.reset();
                } else {
                    statusMsg.textContent = 'Error: ' + (data.details?.join(', ') ?? data.error);
                }
            } catch (err) {
                statusMsg.textContent = 'Request failed: ' + err.message;
            }
        });
    </script>
</body>
</html>
